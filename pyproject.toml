[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-ops-notifications"
version = "0.1.0"
description = "Reusable Slack notifications for Django projects - deployments, backups, and error logging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PJ Hoberman" },
]
keywords = [
    "django",
    "slack",
    "notifications",
    "alerts",
    "devops",
    "monitoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "django>=4.2",
    "slack-sdk>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.7",
]

[project.urls]
Homepage = "https://github.com/pjhoberman/django-ops-notifications"
Repository = "https://github.com/pjhoberman/django-ops-notifications"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_notifications"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "PLC",    # Pylint conventions
    "PLE",    # Pylint errors
    "PLR",    # Pylint refactoring
    "PLW",    # Pylint warnings
    "SLF",    # flake8-self
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
]
ignore = [
    "PLR2004",  # Magic value comparisons
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
